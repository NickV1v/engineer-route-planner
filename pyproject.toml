[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "beeline-dispatch"
version = "0.1.0"
description = "Reproducible field-service scheduling prototype"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "openpyxl>=3.1,<4", "pydantic>=2.9,<3"]

[project.optional-dependencies]
routing = ["pyvalhalla==3.9.0", "networkx==3.5"]
routing-import = ["osmium==4.1.1"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["dispatch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
